[project]
name = "datasheet-to-spec-agent"
version = "0.1.0"
description = "Datasheet-to-spec extraction agent with local Llama + RAG"
requires-python = ">=3.11,<3.12"

dependencies = [
    "llama-index>=0.11",
    "llama-index-llms-ollama>=0.3",
    "llama-index-embeddings-ollama>=0.3",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_agent"]